<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 50" fill="none">
  <!-- MTN MoMo Official Logo -->
  <rect width="170" height="50" rx="10" fill="#FFFDE6"/>
  <!-- MTN Yellow circular badge -->
  <circle cx="27" cy="25" r="17" fill="#FFCC00"/>
  <!-- MTN oval in deep navy -->
  <ellipse cx="27" cy="25" rx="13" ry="8" fill="#002B49"/>
  <!-- MTN text -->
  <text x="27" y="28" text-anchor="middle" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="7" font-weight="900" fill="#FFCC00" letter-spacing="0.5">MTN</text>
  <!-- MoMo brand wordmark -->
  <text x="52" y="27" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#002B49" letter-spacing="-0.5">MoMo</text>
  <text x="52" y="39" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#D99B00" letter-spacing="0.2">Mobile Money</text>
</svg>
